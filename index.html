<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f1e9" />
<meta name="description" content="카메라·렌즈·이종교배 컨버터·필름 재고 관리 대시보드" />
<title>CAMERA · 카메라 컬렉션</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B7%3C/text%3E%3C/svg%3E" />
<style>
:root{
  --bg:#f4f1e9;
  --surface:#fffdf8;
  --surface2:#f8f4ea;
  --ink:#1a1915;
  --ink2:#474439;
  --ink3:#6f6960;
  --line:#e5ddcd;
  --line2:#d5c9b3;
  --amber:#8f5606; --amber-bg:#fdf1dc; --amber-line:#ebcd98; --amber-solid:#c98a2e;
  --green:#0d6a4d; --green-bg:#e8f5ee; --green-line:#b9e1cf;
  --orange:#a24619; --orange-bg:#fdeee3; --orange-line:#f1c3a4;
  --red:#9f2f2e; --red-bg:#fbeaea; --red-line:#eec1bf;
  --r:18px;
  --shadow:0 1px 0 rgba(90,70,30,.04), 0 12px 30px -24px rgba(70,52,20,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{
  margin:0;color:var(--ink);
  background:radial-gradient(1100px 420px at 50% -160px,#fffbf1 0%,rgba(255,251,241,0) 72%),var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",Roboto,sans-serif;
  font-size:15px;line-height:1.55;letter-spacing:-.012em;
  padding-bottom:calc(30px + env(safe-area-inset-bottom));
}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hidden{display:none}

/* ---------- 머리글 ---------- */
header{padding:24px 18px 12px}
header .w{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:36px;height:36px;flex:0 0 auto;color:var(--ink);opacity:.9}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2em;line-height:1;text-transform:uppercase}
h1 span{display:block;margin-top:7px;font-size:12.5px;font-weight:650;letter-spacing:.01em;color:var(--ink3);text-transform:none}
.sub{font-size:12.5px;font-weight:650;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;letter-spacing:0;box-shadow:var(--shadow)}

/* ---------- 탭 ---------- */
nav{position:sticky;top:0;z-index:30;padding:8px 12px;background:rgba(244,241,233,.9);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);border-bottom:1px solid var(--line)}
nav .w{display:flex;gap:4px;width:fit-content;max-width:100%;margin:0 auto;overflow-x:auto;scrollbar-width:none;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px}
nav .w::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:transparent;border:0;color:var(--ink3);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;min-height:40px;white-space:nowrap;transition:background .15s,color .15s}
nav button.on{background:var(--ink);color:#fdfbf5;box-shadow:0 8px 16px -10px rgba(26,25,21,.75)}

main{padding:16px 14px 6px;max-width:1000px;margin:0 auto}

/* ---------- 판(카드) ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0;font-size:15.5px;font-weight:750;letter-spacing:-.02em;line-height:1.35}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.head-ops{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.count{font-size:12px;font-weight:750;color:var(--ink3);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;letter-spacing:0}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.kpi-item{position:relative;overflow:hidden;flex:1 1 150px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px 13px;box-shadow:var(--shadow)}
.kpi-item:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--line2)}
.kpi-item.amber:before{background:var(--amber-solid)}
.kpi-item.green:before{background:#2f9c77}
.kpi-item .lb{display:block;font-size:12px;font-weight:750;color:var(--ink3);letter-spacing:.01em}
.kpi-item .v{display:block;margin-top:3px;font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi-item.amber .v{color:var(--amber)}
.kpi-item.green .v{color:var(--green)}
.kpi-item .k-note{display:block;margin-top:3px;font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:0}
.kpi-item .v em{font-style:normal;font-size:15px;font-weight:750;color:var(--ink3);margin-left:2px;letter-spacing:0}

/* ---------- 구성 ---------- */
.krow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.krow:first-of-type{border-top:0;padding-top:0}
.krow:last-of-type{padding-bottom:0}
.klb{flex:0 0 66px;font-size:12.5px;font-weight:750;color:var(--ink3);padding-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px 9px;white-space:nowrap;letter-spacing:0}
.tag b{font-weight:800;color:var(--ink)}

/* ---------- 배지 ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);background:var(--surface2);white-space:nowrap;line-height:1.5;letter-spacing:0}
.pill.warn{color:var(--orange);background:var(--orange-bg);border-color:var(--orange-line)}
.pill.ok{color:var(--green);background:var(--green-bg);border-color:var(--green-line)}
.pill.bad{color:var(--red);background:var(--red-bg);border-color:var(--red-line)}
.pill.gold{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line)}
.pill.film{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line);font-weight:750}
.pill.film.none{color:var(--ink3);background:transparent;border:1px dashed var(--line2);font-weight:650}

/* ---------- 글자 ---------- */
.muted{color:var(--ink2);font-size:13.5px;line-height:1.6}
.dim{color:var(--ink3);font-size:12.5px;line-height:1.55}

/* ---------- 폼 ---------- */
select,input,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line2);color:var(--ink);border-radius:12px;padding:12px;font-size:16px;font-family:inherit;appearance:none;-webkit-appearance:none;min-height:48px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
input[type=date]{min-height:48px}
textarea{min-height:76px;resize:vertical;line-height:1.55}
label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:13px 0 5px}

/* ---------- 버튼 ---------- */
button{font-family:inherit}
button.btn{background:var(--ink);color:#fdfbf5;border:0;border-radius:12px;padding:13px 18px;font-size:15.5px;font-weight:750;min-height:50px;cursor:pointer;letter-spacing:-.01em}
button.btn:active{transform:translateY(1px)}
button.ghost{background:var(--surface);color:var(--ink2);border:1px solid var(--line2);border-radius:11px;padding:10px 14px;font-size:13.5px;font-weight:650;min-height:42px;cursor:pointer}
button.ghost:active{background:var(--surface2)}
button.sm{padding:7px 11px;font-size:13px;border-radius:10px;min-height:38px}
button.danger{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1 1 220px;max-width:340px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* ---------- 목록 줄 ---------- */
.item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-of-type{border-top:0;padding-top:0}
.item .t{font-size:15px;font-weight:700;line-height:1.4}
.item .d{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.5}
.item .ops{display:flex;gap:6px;flex:0 0 auto;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- 장비 카드 ---------- */
.gear-grid{display:grid;grid-template-columns:1fr;gap:10px}
.gear{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px}
.gear.is-loaded{border-left:4px solid var(--amber-solid);background:linear-gradient(180deg,#fffcf4 0%,var(--surface) 60%)}
.gear.is-repair{border-left:4px solid #d98551}
.gear-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.gear-name{font-size:16px;font-weight:750;letter-spacing:-.025em;line-height:1.35;min-width:0;word-break:keep-all}
.gear .tags{margin-top:9px}
.gear .film-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
.gear-notes{margin-top:8px}
.gear-ops{display:flex;gap:7px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:11px;border-top:1px solid var(--line)}

/* ---------- 장전 필름 카드 ---------- */
.film-grid{display:grid;grid-template-columns:1fr;gap:9px}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px 11px;display:flex;flex-direction:column;gap:8px}
.fb.loaded{background:linear-gradient(180deg,#fffaf0 0%,var(--surface) 70%);border-color:var(--amber-line)}
.fb-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.fb-name{font-size:14.5px;font-weight:700;line-height:1.4;min-width:0;word-break:keep-all}
.fb-format{flex:0 0 auto;font-size:12px;font-weight:650;color:var(--ink3);padding-top:2px}
.fb-badge{display:flex;flex-wrap:wrap;gap:6px}
.fb-bot{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:auto}
.fb-advice{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line2)}
.fb-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.fb-tags .tag{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line);font-weight:750}
.fb-why{font-size:12.5px;line-height:1.55;color:var(--ink2);word-break:keep-all}
.fb-empty{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}

/* ---------- 조합 추천 선택 ---------- */
.intro{margin:0 0 12px}
.pick-block{margin-bottom:6px}
.pick-label{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:750;color:var(--ink2);margin:16px 0 8px}
.step{width:22px;height:22px;flex:0 0 auto;border-radius:50%;background:var(--ink);color:#fdfbf5;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.pick-chips{display:flex;flex-wrap:wrap;gap:7px}
.pick-chips.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.pick-chips.grid2 button{width:100%}
.pick-chips button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line2);color:var(--ink);border-radius:12px;padding:10px 13px;font-size:14px;font-weight:650;min-height:46px;line-height:1.25;text-align:left;cursor:pointer;letter-spacing:-.01em}
.pick-chips button.reset{color:var(--ink3);border-style:dashed;font-weight:600;padding:10px 11px}
.pick-chips button .m{display:block;font-size:11.5px;font-weight:600;color:var(--ink3);margin-top:2px;pointer-events:none}
.pick-chips button:active,.chips button:active,nav button:active{transform:translateY(1px)}
.pick-chips button.on{background:var(--ink);border-color:var(--ink);color:#fdfbf5}
.pick-chips button.on .m{color:#cfc8b8}
select[hidden]{display:none}
/* 상황·조건 칩: 항목 이름 + 한 줄 칩 */
.sit-row{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.sit-row:last-child{margin-bottom:0}
.sit-lb{flex:0 0 34px;font-size:12px;font-weight:750;color:var(--ink3);padding-top:11px;letter-spacing:0}
.sit-chips{flex:1;min-width:0;gap:6px}
.sit-chips button{font-size:13px;padding:8px 11px;min-height:42px;border-radius:11px;letter-spacing:-.02em}
.sit-sum{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

/* ---------- 조합 결과 ---------- */
.combo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}
.combo.top{border-color:var(--amber-line);box-shadow:0 1px 0 rgba(143,86,6,.06),0 16px 34px -26px rgba(143,86,6,.7)}
.combo-head{display:flex;gap:10px;align-items:flex-start}
.rank{flex:0 0 auto;width:27px;height:27px;border-radius:9px;background:var(--surface2);border:1px solid var(--line2);color:var(--ink2);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.combo.top .rank{background:var(--amber);border-color:var(--amber);color:#fff8ec}
.combo-title{font-size:15.5px;font-weight:750;line-height:1.4;letter-spacing:-.025em;word-break:keep-all;min-width:0}
.combo-title .plus{color:var(--ink3);font-weight:600;margin:0 5px}
.combo-meta{font-size:12.5px;color:var(--ink3);margin:5px 0 0 37px;line-height:1.6;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.combo-mount{font-size:12.5px;color:var(--ink3);margin:9px 0 0 37px;line-height:1.5}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 0 37px}
.metric{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:8px 9px;min-width:0}
.metric b{display:block;font-size:16px;font-weight:800;letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.metric span{display:block;font-size:11.5px;font-weight:650;color:var(--ink3);margin-top:1px}
.score{display:flex;align-items:center;gap:9px;margin:12px 0 0 37px}
.score-lb{font-size:12px;font-weight:750;color:var(--ink3);white-space:nowrap}
.score .num{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.bar{flex:1;height:8px;background:#ece6d8;border-radius:99px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
.film-pick{margin:13px 0 0 37px;padding-top:11px;border-top:1px solid var(--line)}
.fp-head{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.04em;margin-bottom:6px}
.fp-row{padding:7px 0}
.fp-line-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fp-name{font-size:14px;font-weight:700;line-height:1.35}
.fp-meta{font-size:12.5px;color:var(--ink3);margin-top:2px}
.fp-line{margin:12px 0 0 37px;font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.combo-loaded{margin:9px 0 0 37px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.combo-loaded b{font-weight:750;color:var(--ink)}
.combo-why{margin:8px 0 0 37px;display:flex;flex-direction:column;gap:3px}
.why-line{font-size:12.5px;line-height:1.55;color:var(--ink2);word-break:keep-all}
.why-line.warn{color:var(--orange)}
.score-split{margin:6px 0 0 37px;font-size:12px;color:var(--ink3);font-weight:650}
.empty{text-align:center;padding:28px 16px}
.empty .e-ic{font-size:26px;line-height:1;margin-bottom:8px;display:block;opacity:.8}

/* ---------- 필름 재고 ---------- */
.fcard{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.fcard:first-of-type{border-top:0;padding-top:2px}
.fcard-main{flex:1 1 180px;min-width:0}
.fcard-name{font-size:15.5px;font-weight:750;letter-spacing:-.02em;line-height:1.35}
.fcard-meta{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.5}
.fcard-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rolls{display:flex;align-items:baseline;gap:3px;color:var(--green);font-weight:800;line-height:1}
.rolls b{font-size:21px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rolls span{font-size:11.5px;font-weight:750}
.rolls.zero{color:var(--red)}

/* ---------- 필터 칩 ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line2);color:var(--ink2);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;min-height:42px;cursor:pointer}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fdfbf5}

/* ---------- 필름 검색 ---------- */
#lfSearch,#fmSearch{background:var(--surface2);border-color:var(--line2)}
#lfResults .item,#fmResults .item{padding:11px 0;gap:9px}
#lfResults .item .t,#fmResults .item .t{font-size:14.5px;word-break:keep-all}
#lfResults .item .d,#fmResults .item .d{font-size:12.5px}
.fpick-note{font-size:12.5px;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-top:8px;line-height:1.5}

/* ---------- 시트 ---------- */
.modal{position:fixed;inset:0;background:rgba(30,26,18,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:flex-end;z-index:60}
.modal.on{display:flex}
.sheet{background:var(--surface);width:100%;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line2);box-shadow:0 -24px 60px -24px rgba(30,24,12,.45)}
.sheet .grab{width:40px;height:4px;background:var(--line2);border-radius:99px;margin:3px auto 14px}
.sheet h3{margin:0;font-size:17px;font-weight:750;letter-spacing:-.02em}
.sect{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--ink3);margin:20px 0 4px;padding-top:14px;border-top:1px solid var(--line)}

/* ---------- 기타 ---------- */
.note{border:1px solid var(--amber-line);background:var(--amber-bg);border-radius:14px;padding:12px 14px;font-size:13px;color:#5b4a2d;line-height:1.6;margin-bottom:12px}
.note b{color:var(--ink)}
.lock{font-size:11px;font-weight:750;color:var(--amber);background:#fff8ea;border:1px solid var(--amber-line);border-radius:6px;padding:0 5px;margin-left:3px;white-space:nowrap}
.priv{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--amber);background:var(--amber-bg);border-radius:8px;padding:5px 9px;line-height:1.5;word-break:break-all}
.priv.off{color:var(--ink3);background:transparent;border:1px dashed var(--line2)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(4px);background:var(--ink);border:1px solid #000;color:#fdfbf5;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:650;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:90;max-width:88vw;text-align:center;box-shadow:0 14px 34px -12px rgba(0,0,0,.55)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{max-width:1000px;margin:0 auto;padding:10px 18px 30px;font-size:12px;color:var(--ink3);line-height:1.75}
footer b{color:var(--ink2)}

@media(min-width:720px){
  h1{font-size:23px}

/* 예전에 저장된 카탈로그 항목(스톡명만 있던 10종)도 검색·표시에 필요한 필드를 갖추게 한다 */
function filmStockSame(a, b){
  var ka = maskStock(a), kb = maskStock(b);
  if(!ka || !kb) return false;
  if(ka === kb) return true;
  var long = ka.length >= kb.length ? ka : kb;
  var short = ka.length >= kb.length ? kb : ka;
  if(long.indexOf(short) !== 0) return false;
  var rest = long.slice(short.length);
  return /^[0-9]+$/.test(rest) && rest.length <= 4;
}
function filmDefaultsFor(stock){
  var name = String(stock === undefined || stock === null ? '' : stock);
  if(!maskStock(name)) return null;
  var list = DEFAULT_FILMS;
  for(var i = 0; i < list.length; i++){ if(filmStockSame(list[i].stock, name)) return list[i]; }
  return null;
}
function enrichFilmEntry(f){
  if(!f || typeof f !== 'object') return f;
  var d = filmDefaultsFor(f.stock || f.name);
  if(!f.stock && f.name) f.stock = f.name;
  if(!f.name) f.name = f.stock || (d ? d.name : '');
  if(!f.brand && d) f.brand = d.brand;
  if((f.iso === undefined || f.iso === null || f.iso === '') && d) f.iso = d.iso;
  if(!f.type && d) f.type = d.type;
  if(!f.formats || !f.formats.length) f.formats = d ? d.formats.slice() : (f.format ? [f.format] : ['35mm']);
  if(!f.format) f.format = d ? d.format : f.formats[0];
  if(f.formats.indexOf(f.format) < 0) f.formats.unshift(f.format);
  if(!f.defaultExp) f.defaultExp = d ? d.defaultExp : (f.format === '35mm' ? 36 : 12);
  if(!f.keywords || !f.keywords.length) f.keywords = d ? d.keywords.slice() : [];
  if(!f.popular) f.popular = d ? d.popular : 10;
  return f;
}
/* 저장된 목록 + 내장 목록을 합친다 — 스톡명이 같은 항목은 저장된 쪽(사용자 메모)을 남긴다 */
function mergeFilmCatalog(list){
  var out = [], seen = {};
  (list || []).forEach(function(f){
    if(!f || !(f.stock || f.name)) return;
    var key = maskStock(f.stock || f.name);
    if(!key || seen[key]) return;
    seen[key] = 1;
    out.push(enrichFilmEntry(f));
  });
  DEFAULT_FILMS.forEach(function(d){
    var key = maskStock(d.stock);
    if(!key || seen[key]) return;
    var dup = out.filter(function(f){
      return filmStockSame(f.stock || f.name, d.stock) && (!f.iso || Number(f.iso) === Number(d.iso));
    })[0];
    if(dup) return;
    seen[key] = 1;
    out.push(clone(d));
  });
  return out;
}
function filmFormatsOf(f){
  if(!f) return [];
  var out = [], seen = {};
  (f.formats || []).forEach(function(x){ if(x && !seen[x]){ seen[x] = 1; out.push(x); } });
  if(f.format && !seen[f.format]) out.push(f.format);
  return out;
}
/* 그 바디 포맷에 맞는 컷수 — 35mm 36컷, 120·127 12컷 */
function filmExpFor(f, fmt){
  if(fmt === '35mm') return 36;
  if(fmt === '120' || fmt === '127') return 12;
  var n = Number(f && f.defaultExp);
  if(n) return n;
  return filmFormatsOf(f).indexOf('35mm') >= 0 ? 36 : 12;
}
function filmEntryFor(stock){
  var key = maskStock(stock);
  if(!key) return null;
  var cat = data.filmCatalog || [];
  var hit = cat.filter(function(f){ return maskStock(f.stock) === key; })[0]
    || cat.filter(function(f){ return filmStockSame(f.stock, stock); })[0];
  if(hit) return hit;
  var d = filmDefaultsFor(stock);
  return d ? enrichFilmEntry(clone(d)) : null;
}
function filmRowFor(stock, fmt){
  var name = String(stock === undefined || stock === null ? '' : stock).trim();
  var key = maskStock(name);
  var entry = filmEntryFor(name);
  var own = (data.films || []).filter(function(f){ return maskStock(f.stock) === key; });
  var rolls = own.reduce(function(n,f){ return n + (Number(f.rolls) || 0); }, 0);
  var formats = filmFormatsOf(entry);
  if(!formats.length){
    own.forEach(function(f){ if(f.format && formats.indexOf(f.format) < 0) formats.push(f.format); });
  }
  var iso = null;
  if(own.length){
    var oi = own[0].iso;
    if(oi !== undefined && oi !== null && oi !== '') iso = Number(oi);
  }
  if(iso === null && entry && entry.iso) iso = Number(entry.iso);
  if(iso === null) iso = isoFromStock(name);
  return {
    stock: name, iso: iso, type: (entry && entry.type) || '',
    formats: formats, format: (entry && entry.format) || formats[0] || '',
    exp: filmExpFor(entry || {defaultExp: null}, fmt),
    rolls: rolls, owned: own.length > 0, entry: entry || null, compatible: true
  };
}
function filmQueryTokens(q){
  var t = String(q === undefined || q === null ? '' : q).toLowerCase()
    .replace(/[()\[\]{},·]/g, ' ').replace(/\s+/g, ' ').trim();
  return t ? t.split(' ') : [];
}
function filmRowHay(r){
  var e = r.entry || {};
  var parts = [r.stock, e.brand, e.type, e.character, r.iso, e.defaultExp];
  parts = parts.concat(e.keywords || []);
  (r.formats || []).forEach(function(x){ parts.push(x); });
  return parts.join(' ').toLowerCase();
}
/* 검색어가 없으면 그 바디 포맷의 필름만(내 보유 → 인기 순), 검색어가 있으면 다른 포맷도 참고로 함께 */
function filmPickerResults(q, fmt){
  var tokens = filmQueryTokens(q);
  var rows = [], seen = {};
  function push(row){
    var key = maskStock(row.stock);
    if(!key) return;
    var same = seen[key] || null;
    if(!same){
      for(var i = 0; i < rows.length; i++){
        if(filmStockSame(rows[i].stock, row.stock)){ same = rows[i]; break; }
      }
    }
    if(same){
      var ex = same;
      ex.owned = ex.owned || row.owned;
      if(ex.rolls < row.rolls) ex.rolls = row.rolls;
      if(!ex.entry && row.entry) ex.entry = row.entry;
      if(!ex.type) ex.type = row.type;
      if(!ex.iso) ex.iso = row.iso;
      if(!ex.formats.length) ex.formats = row.formats;
      return;
    }
    seen[key] = row;
    rows.push(row);
  }
  (data.films || []).forEach(function(f){
    var name = String(f.stock || '').trim();
    if(!name) return;
    var row = filmRowFor(name, fmt);
    if(f.format && f.format !== 'any'){
      row.format = f.format;
      if(row.formats.indexOf(f.format) < 0) row.formats = [f.format];
    }
    push(row);
  });
  (data.filmCatalog || []).forEach(function(f){
    var name = String(f.stock || '').trim();
    if(!name) return;
    push(filmRowFor(name, fmt));
  });
  rows.forEach(function(r){
    r.compatible = !fmt || !r.formats.length || r.formats.indexOf(fmt) >= 0 || r.formats.indexOf('any') >= 0;
    r.hay = filmRowHay(r);
  });
  rows = rows.filter(function(r){
    if(!tokens.length) return r.compatible;
    return tokens.every(function(t){
      if(/^[0-9]+$/.test(t)){
        /* 숫자는 통째로 맞춰야 한다 — '200'이 3200(ISO 3200·이름)에 걸리지 않게 */
        return new RegExp('(^|[^0-9])' + t + '([^0-9]|$)').test(r.hay);
      }
      return r.hay.indexOf(t) >= 0;
    });
  });
  rows.sort(function(a,b){
    if(a.compatible !== b.compatible) return a.compatible ? -1 : 1;
    if((a.rolls > 0) !== (b.rolls > 0)) return a.rolls > 0 ? -1 : 1;
    var pa = Number((a.entry || {}).popular) || 0, pb = Number((b.entry || {}).popular) || 0;
    if(pa !== pb) return pb - pa;
    if(a.rolls !== b.rolls) return b.rolls - a.rolls;
    return a.stock < b.stock ? -1 : (a.stock > b.stock ? 1 : 0);
  });
  return rows;
}
function filmPickRowHtml(r, fmt, bodyId){
  var badges = '';
  if(r.rolls > 0) badges += ' <span class="pill ok">보유 ' + esc(r.rolls) + '롤</span>';
  else if(r.owned) badges += ' <span class="pill bad">재고 0롤</span>';
  var cur = bodyId ? loadedStock(bodyById(bodyId)) : '';
  if(cur && cur === r.stock) badges += ' <span class="pill ok">장전 중</span>';
  var meta = [];
  if(r.iso !== null && r.iso !== undefined) meta.push('ISO ' + r.iso);
  if(r.type) meta.push(r.type);
  if(r.formats && r.formats.length) meta.push(r.formats.join('/'));
  var exp = r.compatible ? r.exp : filmExpFor(r.entry || r, r.format || '');
  if(exp) meta.push(exp + '컷');
  if(r.owned) meta.push(r.rolls > 0 ? r.rolls + '롤 남음' : '재고 없음');
  if(!r.compatible) meta.push('포맷 다름');
  var isoAttr = (r.iso === null || r.iso === undefined) ? '' : r.iso;
  var ops = bodyId
    ? '<button class="ghost sm" data-set-body="' + esc(bodyId) + '" data-set="' + esc(r.stock) + '" data-set-iso="' + esc(isoAttr) + '" data-set-exp="' + esc(exp || '') + '">장전</button>'
    : '<button class="ghost sm" data-fpick="' + esc(r.stock) + '">이 필름</button>';
  return '<div class="item"><div style="min-width:0"><div class="t">' + esc(r.stock) + badges + '</div>'
    + '<div class="d">' + esc(meta.join(' · ')) + '</div></div><div class="ops">' + ops + '</div></div>';
}
function filmPickerSectionsHtml(q, fmt, bodyId){
  var rows = filmPickerResults(q, fmt);
  var held = rows.filter(function(r){ return r.owned && r.compatible; });
  var cat = rows.filter(function(r){ return !r.owned && r.compatible; });
  var other = rows.filter(function(r){ return !r.compatible; });
  var h = '<div class="sect">보유 필름에서 고르기</div>';

  }
  return h;
}
function filmAddSectionsHtml(q){

  var held = rows.filter(function(r){ return r.owned; });

function mountPath(lensMount, bodyMount){

  var seen = {}; seen[lensMount] = true;

      if(a.to === bodyMount) return {hops:chain.length, chain:chain, factor:factor, adapter:chain[0]};

/* ---------- 상황·조건 추천 ---------- */

function baseReason(c, purpose){
  var t = PURPOSES[purpose] || PURPOSES['스냅'];

function scoreCombo(c, purpose, sit){

/* 같은 기종(베이비 롤라이 3대처럼)은 한 대만 남겨 목록이 한 기종으로 차지 않게 */

}

function buildPlan(bodyId, lensId, purpose, sit){

  function add(body, lens, path, fixed){
    var c = {body:body, lens:lens, eq:equivFocal(lens, body, path && path.factor ? path.factor : 1),

    var r = scoreCombo(c, purpose, sit);

    var pen = r.pen.map(function(x){ return x.t; });

    });
  }else if(lensId){
    var lens = lensById(lensId);
    if(!lens) return {list:[], repair:[], purpose:purpose};
    data.bodies.forEach(function(b){
      if(fixedLens(b)) return;                 /* 고정 렌즈 바디는 렌즈 교환 불가 */
      var p = mountPath(lens.mount, b.mount);
      if(p) add(b, lens, p, false);
    });
  }else{
    data.bodies.forEach(function(b){
      var fl = fixedLens(b);
      if(fl){ add(b, fl, null, true); return; }
      var best = null;
      data.lenses.forEach(function(lens){
        var p = mountPath(lens.mount, b.mount);
        if(!p) return;

/* ---------- 필름 추천 + 재고 ---------- */
function inventoryFor(stock, filmFmt){
  var key = maskStock(stock);
  return (data.films || []).filter(function(f){
    if(filmFmt && f.format && f.format !== 'any' && f.format !== filmFmt) return false;
    var fk = maskStock(f.stock);
    return fk && key && (fk === key || fk.indexOf(key) >= 0 || key.indexOf(fk) >= 0);
  });
}
function invSummary(s){
  if(!s.inv || !s.inv.length) return {txt:'재고 미등록', cls:'bad'};
  if(s.rolls > 0){
    var exp = s.inv.map(function(x){ return expiryState(x.expiry); }).filter(function(x){ return x && x.cls !== 'ok'; })[0];
    return {txt:'보유 ' + s.rolls + '롤' + (exp ? ' · ' + exp.text : ''), cls: exp ? (exp.cls === 'bad' ? 'bad' : 'warn') : 'ok'};
  }
  return {txt:'재고 0롤', cls:'bad'};
}
function filmSuggestions(purpose, body, count, sit){
  var want = filmFormatOf(body);
  if(!want) return [];
  var pool = (data.filmCatalog || []).filter(function(f){
    var fmts = f.formats || [];
    return !fmts.length || fmts.indexOf(want) >= 0 || fmts.indexOf('any') >= 0;
  });
  var scored = pool.map(function(f){
    var s = 40;
    if((f.bestFor || []).indexOf(purpose) >= 0) s = 100;
    else if((f.bestFor || []).length) s = 55;
    if(purpose === '실내'){ if(f.iso >= 800) s += 14; else if(f.iso >= 400) s += 8; else s -= 12; }
    if(purpose === '풍경'){ if(f.iso <= 100) s += 14; else if(f.iso >= 400) s -= 10; }
    if(purpose === '인물'){ if(f.iso >= 200 && f.iso <= 400) s += 8; if(/흑백/.test(f.type || '')) s -= 12; }
    if(purpose === '여행'){ if(f.iso >= 200 && f.iso <= 400) s += 10; }
    if(sit && sit.company === 'kids'){ if(f.iso >= 400) s += 12; else if(f.iso <= 100) s -= 10; }
    var already = loadedStock(body);
    if(already && maskStock(already) === maskStock(f.stock)) s += 10;
    var inv = inventoryFor(f.stock, want);
    var rolls = inv.reduce(function(n,x){ return n + (Number(x.rolls) || 0); }, 0);
    if(rolls > 0) s += 12;
    return {film:f, score:s, rolls:rolls, inv:inv};
  }).sort(function(a,b){ return b.score - a.score; });
  return scored.slice(0, count || 2);
}

/* ================= 장전된 조합의 추천 상황 ================= */
var ISO_STEPS = [50, 100, 125, 160, 200, 250, 400, 800, 1600, 3200];
function isoFromStock(stock){
  var t = String(stock || '');
  for(var i = 0; i < ISO_STEPS.length; i++){
    var re = new RegExp('(^|[^0-9])' + ISO_STEPS[i] + '([^0-9]|$)');
    if(re.test(t)) return ISO_STEPS[i];
  }
  return null;
}
/* 장전된 스톡의 ISO·타입·성격 — 보유 목록 → 카탈로그 → 이름 순으로 찾음 */
function filmProfile(body){
  var stock = loadedStock(body);
  if(!stock) return null;
  var key = maskStock(stock);
  var hit = null, own = null;
  (data.filmCatalog || []).forEach(function(f){ if(!hit && maskStock(f.stock) === key) hit = f; });
  (data.films || []).forEach(function(f){ if(!own && maskStock(f.stock) === key) own = f; });
  var src = hit || own || {};
  var iso = loadedIsoOf(body);
  if(iso === null) iso = isoFromStock(stock);
  if(iso === null && own && own.iso) iso = Number(own.iso);

  var name = stock + ' ' + (src.type || '') + ' ' + (src.character || '');
  return {
    stock: stock, iso: iso === null ? null : Number(iso), type: src.type || '', character: src.character || '',
    bw: /흑백|ilford|hp5|delta|tri-x|fomapan|acros/i.test(name),
    slide: /슬라이드|velvia|provia|ektachrome|e100/i.test(name),

/* 바디 + 렌즈 + 장전 필름을 함께 보고 "어디에 적합한지"를 규칙으로 계산 */

  if(med) s -= 10;

  else if(eq && eq > 85) s -= 18;
  else if(eq && eq < 28) s -= 8;

  if(af) s += 4;
  add('데이트 · 인물', s, lensLab + (filmLab ? ' + ' + filmLab : '')
    + (med ? ' — 큰 판형의 부드러운 색과 계조' : ' — 배경을 풀어낸 인물') + '이 잘 나와요');

  /* 도시 스냅 (날씨는 필름 ISO로) */
  s = 50;
  if(eq && eq >= 28 && eq <= 55) s += 26; else if(eq) s -= 10;
  if(af) s += 8;
  if(pk) s += 8;
  if(iso && iso >= 100 && iso <= 400) s += 8; else if(iso && iso > 800) s -= 8;
  if(med) s -= 8;
  add(mood + ' 도시 스냅', s, lensLab + (af ? ' AF' : '') + (pk ? ' · 주머니 크기' : '') + (isoLab ? ' · ' + isoLab : '') + ' — 거리를 걸으며 담기 좋아요');

  /* 인물·감성 */
  s = 46;
  if(eq && eq >= 40 && eq <= 85) s += 16;
  else if(eq && eq >= 28) s += 4;
  if(ap && ap <= 2.8) s += 12;
  if(med) s += 24;
  if(fp && fp.portrait) s += 20;
  if(fp && fp.bw) s += 2;
  add(med ? (mood + (square ? ' 정사각 인물' : ' 중형 인물')) : (mood + ' 인물·감성'), s,
    lensLab + (filmLab ? ' + ' + filmLab : '') + (med ? ' — 큰 판형으로 피부톤과 계조를 살려요' : ' — 배경을 정리한 인물에 좋아요'));

  /* 혼자 산책 */
  s = 48;
  if(med) s += 18;
  if(!af) s += 10;
  if(pk) s += 12;
  if(iso && iso <= 400) s += 6;
  if(w <= 500) s += 6;
  if(eq && eq >= 120) s -= 12;
  add('느긋한 혼자 산책', s, (med ? '중형 판형' : (pk ? '주머니 크기' : '수동 조작')) + ' · ' + lensLab
    + (isoLab ? ' · ' + isoLab : '') + ' — 천천히 구도 잡으며 걷기 좋아요');

  /* 여행·풍경 */
  s = 46;
  if(eq && eq <= 35) s += 22; else if(eq && eq <= 50) s += 12;
  if(pk) s += 8;
  if(iso && iso >= 100 && iso <= 400) s += 6;
  add('여행·풍경', s, lensLab + (isoLab ? ' · ' + isoLab : '') + ' — 풍경과 거리를 두루 담아요');

  /* 실내·저조도 */
  s = 38;
  if(iso && iso >= 800) s += 26; else if(iso && iso >= 400) s += 8;
  if(ap && ap <= 2) s += 10;
  if(ae) s += 6;
  add('실내·저조도', s, isoLab + (ap ? ' · f/' + ap : '') + ' — 빛이 약한 곳에서도 노출이 서요');

  shots.sort(function(a, b){ return b.p - a.p; });
  var top = [];
  shots.forEach(function(x){
    if(top.length >= 2 || x.p < 62) return;
    /* 인물 계열 태그가 둘 다 차지하지 않게 */
    var dup = /인물/.test(x.label) && top.some(function(y){ return /인물/.test(y.label); });
    if(dup) return;
    top.push(x);
  });
  if(!top.length) top = shots.slice(0, 2);
  return {
    tags: top.map(function(x){ return x.label; }),
    reason: top.length ? top[0].why : '',
    scores: shots
  };
}

  var parts = [];

  if(l.hood) parts.push('후드 ' + l.hood);
  if(l.minFocus) parts.push('최단 ' + l.minFocus);
  if(l.elements) parts.push(l.elements);
  if(l.weight) parts.push(l.weight);
  return parts.map(esc).join(' · ');
}

function syncRecChips(){
  var b = document.getElementById('recBody');
  var l = document.getElementById('recLens');
  var p = document.getElementById('recPurpose');
  function mark(sel, attr){
    var nodes = document.querySelectorAll('[' + attr + ']');
    var cur = sel && sel.value ? sel.value : '';
    for(var i = 0; i < nodes.length; i++){
      var v = nodes[i].getAttribute(attr) || '';
      var hit = !!v && cur === v;
      nodes[i].classList.toggle('on', hit);
      if(nodes[i].setAttribute) nodes[i].setAttribute('aria-pressed', hit ? 'true' : 'false');
    }
  }
  mark(b, 'data-pick-body');
  mark(l, 'data-pick-lens');
  mark(p, 'data-pick-purpose');
  Object.keys(SIT_GROUPS).forEach(function(key){
    var el = document.getElementById(SIT_SELECT[key]);
    var cur = el && el.value ? el.value : 'any';
    var nodes = document.querySelectorAll('[data-pick-sit="' + key + '"]');
    for(var i = 0; i < nodes.length; i++){
      var hit = (nodes[i].getAttribute('data-sit-value') || 'any') === cur;
      nodes[i].classList.toggle('on', hit);
      if(nodes[i].setAttribute) nodes[i].setAttribute('aria-pressed', hit ? 'true' : 'false');
    }
  });
}

function situationOf(){

function sitTagHtml(sit){
  var out = [];
  function label(group, key){
    var g = SIT_GROUPS[group];
    for(var i = 0; i < g.options.length; i++){ if(g.options[i][0] === key) return g.options[i][1]; }
    return '';
  }
  if(sit.company && sit.company !== 'any') out.push(label('company', sit.company));
  if(sit.place && sit.place !== 'any') out.push(label('place', sit.place));
  if(sit.weight && sit.weight !== 'any') out.push(label('weight', sit.weight));
  return out.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('');
}

function buildPlanNote(bodyId, lensId, plan){
  if(bodyId){
    var b = bodyById(bodyId);
    return nameOf(b) + '에 물릴 렌즈 ' + plan.list.length + '종을 상황에 맞춰 비교했어요';
  }
  if(lensId){
    var l = lensById(lensId);
    return (l ? l.model : '선택한 렌즈') + '를 물릴 수 있는 바디 ' + plan.list.length + '대를 비교했어요';
  }
  var total = plan.considered || (plan.list.length + plan.repair.length);
  return '보유 바디 ' + total + '대를 한 대씩 비교했어요' + (plan.repair.length ? ' · 수리 중 ' + plan.repair.length + '대는 제외' : '') + (total > plan.list.length + plan.repair.length ? ' · 같은 기종은 한 대만' : '');
}

  if(def.t === 'select'){
    h += '<select data-k="' + esc(def.k) + '"><option value="">' + esc(def.blank || '— 선택 —') + '</option>';
    (def.opts || []).forEach(function(o){

      h += '<option value="' + esc(o) + '"' + (String(v) === String(o) ? ' selected' : '') + '>' + esc(FORMATS[o] ? FORMATS[o].label : o) + '</option>';
    });

    h += '<textarea data-k="' + esc(def.k) + '" placeholder="' + esc(def.ph || '') + '">' + esc(v) + '</textarea>';

function openSheet(type, id){
  var cfg = SCHEMA[type];
  if(!cfg) return;
  var list = data[type] || [];

  var p = cur ? (privFor(type, id) || {}) : {};
  var h = '<div class="grab"></div>'
    + '<div class="row"><h3>' + esc(cfg.label) + (cur ? ' 수정' : ' 추가') + '</h3>'
    + '<button class="ghost sm" id="sheetClose">닫기</button></div>';
  if(type === 'films' && !cur) h += filmAddPickerHtml();
  cfg.fields.forEach(function(d){ h += fieldHtml(d, cur); });
  if(type === 'bodies') h += loadedFieldsHtml(cur);
  h += '<div class="sect">개인 기록 · 이 기기에만 저장</div>'
    + '<div class="dim" style="margin-bottom:2px">공개 페이지와 장비 목록 JSON에는 들어가지 않아요.</div>';
  PRIV_FIELDS.forEach(function(d){ h += fieldHtml(d, p); });

    + '</div>';

  sheet.innerHTML = h;
  document.getElementById('modal').classList.add('on');
  document.getElementById('sheetClose').onclick = closeSheet;

  if(type === 'bodies'){
    var lfPick = sheet.querySelector('[data-lf="pick"]');
    var lfCustomBox = sheet.querySelector('#lfCustom');
    var lfIsoIn = sheet.querySelector('[data-lf="iso"]');
    if(lfPick) lfPick.onchange = function(){
      var v = lfPick.value;
      if(lfCustomBox) lfCustomBox.classList.toggle('hidden', v !== '__custom');
      if(v && v !== '__custom' && lfIsoIn){
        var hit = filmStockChoices(filmFormatOf(cur)).filter(function(c){ return c.stock === v; })[0];
        if(hit && hit.iso) lfIsoIn.value = hit.iso;
      }
    };
    var fmSel = sheet.querySelector('[data-k="format"]');
    var lfWrap = sheet.querySelector('#lfWrap');
    if(fmSel && lfWrap){
      fmSel.onchange = function(){
        var v = fmSel.value;
        var digital = !!(v && FORMATS[v] && FORMATS[v].film === null);
        lfWrap.classList.toggle('hidden', digital);
      };
      fmSel.onchange();
    }
  }

  document.getElementById('sheetSave').onclick = function(){
    var obj = cur ? cur : {id: uid(type)};
    cfg.fields.forEach(function(d){
      var el = sheet.querySelector('[data-k="' + d.k + '"]');
      var raw = el ? String(el.value).trim() : '';
      if(d.t === 'number') obj[d.k] = raw === '' ? null : Number(raw);
      else obj[d.k] = raw;
    });
    if(type === 'bodies'){
      var pickEl = sheet.querySelector('[data-lf="pick"]');
      var customIn = sheet.querySelector('[data-lf="custom"]');
      var isoIn = sheet.querySelector('[data-lf="iso"]');
      var noteIn = sheet.querySelector('[data-lf="note"]');
      var stockName = '';
      if(isFilmBody(obj) && pickEl){
        stockName = pickEl.value === '__custom'
          ? (customIn ? String(customIn.value).trim() : '')
          : String(pickEl.value || '').trim();
      }
      if(NO_FILM_LIST.indexOf(stockName) >= 0) stockName = '';
      var isoRaw = isoIn ? String(isoIn.value).trim() : '';
      var isoVal = isoRaw === '' ? null : Number(isoRaw);
      if(stockName && (isoVal === null || isNaN(isoVal))){
        var hitS = findFilmChoice(stockName, filmFormatOf(obj));
        isoVal = hitS && hitS.iso ? Number(hitS.iso) : null;
      }
      obj.loadedFilm = stockName ? stockName : NO_FILM;
      obj.loadedIso = stockName ? isoVal : null;
      obj.loadedFilmNote = stockName ? (noteIn ? String(noteIn.value).trim() : '') : '';
    }
    var pObj = {};
    PRIV_FIELDS.forEach(function(d){
      var el = sheet.querySelector('[data-k="' + d.k + '"]');
      var raw = el ? String(el.value).trim() : '';
      if(d.t === 'number') pObj[d.k] = raw === '' ? null : Number(raw);
      else pObj[d.k] = raw;
    });
    if(!cur) data[type].push(obj);
    var keep = pObj.serial || pObj.memo || (pObj.price !== null && pObj.price !== undefined && pObj.price !== '') || pObj.boughtAt;
    priv[type] = priv[type] || {};
    if(keep) priv[type][obj.id] = pObj;
    else delete priv[type][obj.id];
    saveData(); savePriv(); closeSheet(); renderAll(); toast('저장했어요');
  };
  if(cur){
    document.getElementById('sheetDel').onclick = function(){
      if(!confirm('이 항목을 삭제할까요? 개인 기록도 함께 지워집니다.')) return;
      data[type] = data[type].filter(function(x){ return x.id !== cur.id; });
      data.removed = data.removed || [];
      if(data.removed.indexOf(cur.id) < 0) data.removed.push(cur.id);
      if(priv[type]) delete priv[type][cur.id];
      saveData(); savePriv(); closeSheet(); renderAll(); toast('삭제했어요');
    };
  }
}

function bindRec(){
  var b = document.getElementById('recBody');
  var l = document.getElementById('recLens');
  var p = document.getElementById('recPurpose');
  if(!b || !l || !p) return;
  b.onchange = function(){ if(b.value) l.value = ''; syncRecChips(); if(recAuto) runRec(); };
  l.onchange = function(){ if(l.value) b.value = ''; syncRecChips(); if(recAuto) runRec(); };
  p.onchange = function(){ syncRecChips(); if(recAuto) runRec(); };
  Object.keys(SIT_SELECT).forEach(function(key){
    var el = document.getElementById(SIT_SELECT[key]);
    if(el) el.onchange = function(){ syncRecChips(); if(recAuto) runRec(); };
  });
}
function showTab(name){
  ['home','gear','rec','film','data'].forEach(function(n){
    document.getElementById('tab-' + n).classList.toggle('hidden', n !== name);
  });
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-tab') === name);
  });
  window.scrollTo(0, 0);
}
function downloadJSON(obj, name){
  var blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ================= 이벤트 ================= */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.getAttribute) return;

  var tab = t.getAttribute('data-tab');
  if(tab){ showTab(tab); return; }

  var goto_ = t.getAttribute('data-goto');
  if(goto_){ showTab(goto_); return; }

  var filt = t.getAttribute('data-filter');
  if(filt){ gearFilter = filt; document.getElementById('tab-gear').innerHTML = renderGear(); return; }

  var add = t.getAttribute('data-add');
  if(add){ openSheet(add, null); return; }

  if(t.hasAttribute && t.hasAttribute('data-pick-body')){
    var pbEl = document.getElementById('recBody');
    var plEl = document.getElementById('recLens');
    if(pbEl) pbEl.value = t.getAttribute('data-pick-body') || '';
    if(plEl && pbEl && pbEl.value) plEl.value = '';
    syncRecChips(); if(recAuto) runRec(); return;
  }
  if(t.hasAttribute && t.hasAttribute('data-pick-lens')){
    var plEl2 = document.getElementById('recLens');
    var pbEl2 = document.getElementById('recBody');
    if(plEl2) plEl2.value = t.getAttribute('data-pick-lens') || '';
    if(pbEl2 && plEl2 && plEl2.value) pbEl2.value = '';
    syncRecChips(); if(recAuto) runRec(); return;
  }
  if(t.hasAttribute && t.hasAttribute('data-pick-sit')){
    var sitKey = t.getAttribute('data-pick-sit');
    var sitEl = document.getElementById(SIT_SELECT[sitKey] || '');
    if(sitEl) sitEl.value = t.getAttribute('data-sit-value') || 'any';
    syncRecChips(); if(recAuto) runRec(); return;
  }
  if(t.hasAttribute && t.hasAttribute('data-pick-purpose')){
    var ppEl = document.getElementById('recPurpose');
    if(ppEl) ppEl.value = t.getAttribute('data-pick-purpose') || '스냅';
    syncRecChips(); if(recAuto) runRec(); return;
  }

  var ed = t.getAttribute('data-edit');
  if(ed){ var parts = ed.split(':'); openSheet(parts[0], parts[1]); return; }

  var loadId = t.getAttribute('data-loaded');
  if(loadId){ openLoadedSheet(loadId); return; }

  var setBody = t.getAttribute('data-set-body');
  if(setBody){
    var stk = t.getAttribute('data-set') || '';
    var exp = t.getAttribute('data-set-exp');
    var minusEl = document.getElementById('lfMinus');
    applyFilmChoice(setBody, stk, t.getAttribute('data-set-iso'), exp, !!(minusEl && minusEl.checked));
    closeSheet();
    return;
  }

  var fpk = t.getAttribute('data-fpick');
  if(fpk){ filmPickIntoFields(fpk); return; }

  var roll = t.getAttribute('data-roll');
  if(roll){
    var dir = Number(t.getAttribute('data-dir') || 1);
    var f = data.films.filter(function(x){ return x.id === roll; })[0];
    if(f){
      var n = Math.max(0, (Number(f.rolls) || 0) + dir);
      f.rolls = n; saveData(); renderAll(); toast(f.stock + ' ' + n + '롤');
    }
    return;
  }

  if(t.id === 'recGo'){ runRec(); return; }

  if(t.id === 'btnReveal' || t.id === 'btnReveal2'){
    reveal = !reveal; renderAll(); toast(reveal ? '개인정보를 보여줘요' : '개인정보를 숨겼어요'); return;
  }

  if(t.id === 'btnExport'){
    var out = clone(data);
    downloadJSON({kind:'camera-collection', version:1, exportedAt:new Date().toISOString(), bodies:out.bodies,
      lenses:out.lenses, adapters:out.adapters, films:out.films, filmCatalog:out.filmCatalog},
      'camera-collection.json');
    toast('장비 목록을 내보냈어요'); return;
  }
  if(t.id === 'btnCopy'){
    var text = JSON.stringify(data, null, 2);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('복사했어요'); }, function(){ toast('복사가 막혔어요 — 내보내기를 써 주세요'); });
    }else{ toast('이 브라우저에서는 복사를 지원하지 않아요'); }
    return;
  }
  if(t.id === 'btnImport'){ document.getElementById('fileIn').click(); return; }
  if(t.id === 'btnPrivExport'){
    downloadJSON({kind:'camera-private', version:1, exportedAt:new Date().toISOString(), items:priv}, 'camera-private.json');
    toast('개인 기록을 내보냈어요 — 공개 저장소에 올리지 마세요'); return;
  }
  if(t.id === 'btnPrivImport'){ document.getElementById('filePriv').click(); return; }
  if(t.id === 'btnReset'){
    if(!confirm('장비 목록을 초기값으로 되돌릴까요? 개인 기록은 그대로 남습니다.')) return;
    data = normalize(clone(seed)); data.seedVersion = SEED_VERSION; data.removed = [];
    saveData(); renderAll(); toast('초기값으로 되돌렸어요'); return;
  }
  if(t.id === 'btnPrivClear'){
    if(!confirm('시리얼·구입가·개인 메모를 모두 지울까요? 되돌릴 수 없습니다.')) return;
    priv = {bodies:{}, lenses:{}, adapters:{}, films:{}}; savePriv(); renderAll(); toast('개인 기록을 지웠어요'); return;
  }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if(!t || !t.id) return;
  if(t.id === 'fileIn'){
    var file = t.files && t.files[0];
    if(!file) return;
    readJSON(file, function(d){
      if(!d.bodies || !d.lenses) throw new Error('장비 목록 형식이 아니에요');
      data = normalize(d); saveData(); renderAll(); toast('장비 목록을 가져왔어요');
    });
    t.value = '';
  }
  if(t.id === 'filePriv'){
    var file2 = t.files && t.files[0];
    if(!file2) return;
    readJSON(file2, function(d){
      var items = d && d.items ? d.items : d;
      if(!items || typeof items !== 'object') throw new Error('개인 기록 형식이 아니에요');
      ['bodies','lenses','adapters','films'].forEach(function(k){
        priv[k] = priv[k] || {};
        var src = items[k] || {};
        Object.keys(src).forEach(function(id){ priv[k][id] = src[id]; });
      });
      savePriv(); renderAll(); toast('개인 기록을 가져왔어요');
    });
    t.value = '';
  }
});
function readJSON(file, ok){
  var reader = new FileReader();
  reader.onload = function(){
    try{ ok(JSON.parse(String(reader.result))); }
    catch(err){ toast('가져오지 못했어요: ' + err.message); }
  };
  reader.readAsText(file);
}

renderAll();
</script>
</body>
</html>
