<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>390px 미리보기</title>
<meta name="robots" content="noindex">
<style>html,body{margin:0;background:#c9c4b8}iframe{display:block;width:390px;height:844px;border:0;background:#f4f1e9}</style>
</head>
<body>
<iframe id="fr" src="./index.html?v=390thumbs" title="390px 미리보기"></iframe>
<script>
/* 미리보기용: ?y=1200 이면 그만큼 스크롤한 상태로 보여 준다(같은 출처라 iframe 내부 제어 가능) */
(function(){
  var y = Number((location.search.match(/[?&]y=(\d+)/) || [])[1] || 0);
  var fr = document.getElementById('fr');
  fr.addEventListener('load', function(){
    if(!y) return;
    try { fr.contentWindow.scrollTo(0, y); } catch(e) {}
  });
})();
</script>
</body>
</html>
